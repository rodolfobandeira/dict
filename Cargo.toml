[package]
name = "dict"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A Canadian English dictionary for the command line"
license = "MIT"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.1"

[profile.release]
lto = true
strip = true
